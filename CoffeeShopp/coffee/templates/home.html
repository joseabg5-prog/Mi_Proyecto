{% extends 'base.html' %}

{% block content %}
<div class="text-center mb-5">
    <h1 class="display-4 font-weight-bold">Nuestros Servicios</h1>
    <p class="lead text-muted">Relájate con los mejores tratamientos y cafés</p>
</div>

<div class="row">
    {% for c in lista_cafes %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm border-0">
            <img src="{{ c.image }}" class="card-img-top" alt="{{ c.name }}" style="height: 220px; object-fit: cover;">
            
            <div class="card-body d-flex flex-column text-center">
                <h5 class="card-title font-weight-bold">{{ c.name }}</h5>
                <p class="card-text text-muted small">Disfruta de una experiencia única en nuestro centro especializado.</p>
                <div class="mt-auto">
                    <p class="h4 text-success font-weight-bold mb-3">${{ c.price }}</p>
                    <a href="{% url 'detalle' c.id %}" class="btn btn-primary btn-block shadow-sm">Pedir ahora</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
